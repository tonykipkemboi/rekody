name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build the CLI binary for macOS (aarch64 + x86_64)
  # ---------------------------------------------------------------------------
  build-cli:
    strategy:
      matrix:
        include:
          # aarch64 builds on macos-26 so it also has the macOS 26 SDK
          # (FoundationModels) to compile the rekody-fm cleanup helper.
          - runner: macos-26
            arch: aarch64
            target: aarch64-apple-darwin
            cargo_flags: ""
          # ort (ONNX Runtime) publishes no prebuilt x86_64-apple-darwin
          # binaries, so the Intel build drops the `nemotron` default feature.
          # Intel users selecting stt_engine = "nemotron" get a clear error.
          - runner: macos-14
            arch: x86_64
            target: x86_64-apple-darwin
            cargo_flags: "--no-default-features"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Toolchain + cross-compile targets come from rust-toolchain.toml so
      # release builds use the same pinned compiler as CI and local dev.
      - run: rustup show

      # Apple Foundation Models helper (Apple Silicon + macOS 26 only). Built
      # against the macOS 26 SDK present on the macos-26 runner; bundled into
      # the aarch64 tarball below. Adhoc-signed like the Rust binary — Homebrew
      # formulae aren't quarantined, and calling the on-device model needs no
      # entitlement, so no codesign/notarization is required.
      - name: Build Foundation Models helper
        if: matrix.arch == 'aarch64'
        run: swift build -c release --package-path helpers/rekody-fm

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-release-

      # --locked: the committed Cargo.lock is the only dependency resolution a
      # release may use — a build that would resolve anything new fails instead
      # of silently pulling versions nobody reviewed.
      - name: Build CLI binary
        run: cargo build --release --locked -p rekody-core ${{ matrix.cargo_flags }} --target ${{ matrix.target }}

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package CLI binary
        run: |
          mkdir -p dist
          PKGDIR=$(mktemp -d)
          cp target/${{ matrix.target }}/release/rekody "$PKGDIR/rekody"
          # Bundle the on-device cleanup helper into the aarch64 tarball when built.
          if [ -f helpers/rekody-fm/.build/release/rekody-fm ]; then
            cp helpers/rekody-fm/.build/release/rekody-fm "$PKGDIR/rekody-fm"
          fi
          tar -czf "dist/rekody-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.tar.gz" -C "$PKGDIR" .
          rm -rf "$PKGDIR"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-macos-${{ matrix.arch }}
          path: dist/rekody-*.tar.gz

  # ---------------------------------------------------------------------------
  # Create GitHub Release with all artifacts
  # ---------------------------------------------------------------------------
  create-release:
    needs: [build-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For SLSA build provenance on the release artifacts.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f -name '*.tar.gz' -exec cp {} release-assets/ \;
          ls -lah release-assets/

      - name: Generate SHA256SUMS
        working-directory: release-assets
        run: |
          shasum -a 256 * > SHA256SUMS
          cat SHA256SUMS

      # SLSA build provenance: publishes a signed attestation binding each
      # artifact to this workflow run, so anyone can verify a tarball was
      # built here from this commit (`gh attestation verify <file> -R
      # rekody/rekody`) rather than substituted after the fact.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/SHA256SUMS

      # The release body is the curated CHANGELOG.md section for this
      # version; the auto-generated commit list is appended below it.
      - name: Extract changelog section
        run: |
          awk -v ver="${{ steps.version.outputs.version }}" '
            /^## \[/ { grab = ($0 ~ "^## \\[" ver "\\]"); next }
            grab { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "_No CHANGELOG.md section for this version._" > release-notes.md
          fi
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Update Homebrew tap formula with new version + checksums
  # ---------------------------------------------------------------------------
  update-homebrew-tap:
    needs: [create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Fetch SHA256SUMS from release
        id: sums
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SUMS=$(curl -fsSL "https://github.com/rekody/rekody/releases/download/v${VERSION}/SHA256SUMS")
          SHA_AARCH64=$(echo "$SUMS" | grep "macos-aarch64" | awk '{print $1}')
          SHA_X86_64=$(echo  "$SUMS" | grep "macos-x86_64"  | awk '{print $1}')
          echo "sha_aarch64=$SHA_AARCH64" >> "$GITHUB_OUTPUT"
          echo "sha_x86_64=$SHA_X86_64"   >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rekody/homebrew-rekody
          token: ${{ secrets.PAT_HOMEBREW }}
          path: tap

      - name: Update formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA_AARCH64="${{ steps.sums.outputs.sha_aarch64 }}"
          SHA_X86_64="${{ steps.sums.outputs.sha_x86_64 }}"

          sed -i "s/version \".*\"/version \"${VERSION}\"/" tap/Formula/rekody.rb
          sed -i "/macos-aarch64/{ n; s/sha256 \".*\"/sha256 \"${SHA_AARCH64}\"/ }" tap/Formula/rekody.rb
          sed -i "/macos-x86_64/{  n; s/sha256 \".*\"/sha256 \"${SHA_X86_64}\"/ }"  tap/Formula/rekody.rb

          cat tap/Formula/rekody.rb

      - name: Commit and push formula update
        run: |
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/rekody.rb
          git diff --staged --quiet || git commit -m "chore: update rekody to v${{ steps.version.outputs.version }}"
          git push
